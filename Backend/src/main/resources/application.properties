spring.application.name=backend

# Si existe un archivo .env dentro de /Backend se leen las variables desde ahí (ver .env.example).
# El .env NO se sube a Git.
spring.config.import=optional:file:.env[.properties]

# ==========================================
# BASE DE DATOS (los datos reales van en variables de entorno)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/anteiku_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ==========================================
# CORREO (Gmail SMTP)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# SEGURIDAD
# ==========================================
# JWT_SECRET es obligatorio: una clave en base64 de al menos 32 bytes (openssl rand -base64 32)
app.jwt.secret=${JWT_SECRET}
# 24 horas
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Origenes que pueden llamar a la API, separados por coma
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# URL del frontend (se usa en el correo de bienvenida)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Administrador inicial. Si las dos variables están definidas se crea al arrancar (si no existe).
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
