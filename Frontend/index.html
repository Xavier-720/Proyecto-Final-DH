<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anteiku Stays</title>
  </head>
  <body>
    <script>
      // aplica el tema guardado antes de que cargue React, así no parpadea al recargar
      try {
        document.documentElement.className = localStorage.getItem('tema') === 'oscuro' ? 'dark-mode' : 'light-mode';
      } catch (e) {
        document.documentElement.className = 'light-mode';
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
